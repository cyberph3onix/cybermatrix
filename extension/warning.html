<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Warning: CyberMatrix</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 0; background: #fbeaea; color: #2a0b10; }
    main { max-width: 640px; margin: 8vh auto; padding: 0 16px; }
    h1 { font-size: 28px; margin: 0 0 8px; color: #7a1020; }
    .url { font: 14px ui-monospace, monospace; word-break: break-all; background: #fff; padding: 8px 10px; border-radius: 4px; border: 1px solid #e3b5bb; }
    ul { padding-left: 20px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button { min-height: 44px; padding: 0 18px; border-radius: 4px; font-size: 15px; font-weight: 600; cursor: pointer; }
    #back { background: #7a1020; color: #fff; border: 0; }
    #report { background: #fff; color: #1d4e7b; border: 1px solid #1d4e7b; }
    #go { background: transparent; color: #5b2a30; border: 0; text-decoration: underline; font-weight: 400; }
    .note { font-size: 13px; color: #5b2a30; margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">This page looks dangerous</h1>
    <p>CyberMatrix stopped this page before it loaded. Don't enter passwords, OTPs, PINs or card details on it.</p>
    <p class="url" id="url"></p>
    <p><strong id="reason"></strong></p>
    <ul id="findings"></ul>
    <div class="actions">
      <button id="back">Go back</button>
      <button id="report">Run a full assessment</button>
      <button id="go">Open the page anyway</button>
    </div>
    <p class="out" id="out"></p>
    <p class="note" id="note"></p>
  </main>
  <script type="module" src="warning.js"></script>
</body>
</html>
